name: Playwright Regression Tests
on:
  workflow_dispatch:
    inputs:
      Environment:
        description: "Environment to run the scripts"
        required: true
        type: choice
        options:
          - UAT
          - SIT
      files:
        description: "Files to run the regression tests on"
        required: true
        type: string
      Browser:
        description: "Select the browser to run the scripts"
        type: choice
        default: chromium
        options:
          - chromium
          - Google_Chrome
          - Microsoft_Edge
          - firefox
          - webkit
      workers:
        description: "No.of workers to run the scripts in parallel"
        required: true
        default: 1
        type: number
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Install branded browsers
        run: npx playwright install chrome msedge
      - name: Run Playwright tests
        run: |
          npx playwright test "${{ inputs.files }}" \
            --workers=${{ inputs.workers }} \
            --project=${{ inputs.Browser }}
        env:
          TEST_ENV: ${{ inputs.Environment }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
